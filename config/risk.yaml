# Risk limits — the risk manager enforces these before any order is placed.
#
# Tuned aggressive on purpose. Three of these were previously set in ways that
# capped upside without actually protecting (see README "Why these numbers"):
# a fixed take-profit that cut winners short, a fixed 5% stop that sat inside
# one day's noise on high-volatility names, and a noise floor high enough that
# the LLM read almost never changed an outcome.

# Position size is derived from RISK, not from a flat percentage of equity:
#
#     position value = (risk_per_trade_pct x equity) / stop distance
#
# so every entry puts roughly the same dollars at stake if its stop is hit.
# A quiet name on a 6% stop gets a big position; a 90%-volatility name on a 20%
# stop gets a small one. With a flat percentage the second position would carry
# more than three times the risk of the first for the same headline "size".
risk_per_trade_pct: 0.015    # ~1.5% of equity at risk per position
max_position_pct: 0.18       # hard cap, whatever the formula asks for
min_position_pct: 0.04       # below this a position isn't worth opening

max_total_exposure_pct: 1.00 # absolute ceiling only — the regime table below and the cash buffer bind first
max_open_positions: 8
max_new_orders_per_cycle: 5

# Entry gating. min_quant_score_to_consider is a noise floor on the QUANT score
# alone: below it the technical read is treated as having no information, so the
# LLM can't carry a trade by itself.
min_quant_score_to_consider: 0.15
# 0.35 was the best of {0.20, 0.25, 0.35} on the *same* 2019–2026 window used
# to pick it — in-sample selection, not a walk-forward proof. Live uses it as
# a conservative bar; do not treat the 21.3% CAGR as out-of-sample evidence.
buy_threshold: 0.35
sell_threshold: -0.25

# Exit bar for holdings that have fallen off the core watchlist — leftovers from
# a pool swap, not part of the book under validation. They sit on the same risk
# budget as the names being tested but contribute nothing to the question the
# book is meant to answer, so a name that has stopped earning its exposure leaves
# rather than parking the budget. Applied only on the off-watchlist path, where
# the LLM is never consulted (combined == quant there), so this reads as either.
#
# 0.10 separates the two groups cleanly on the record to date: over the last ten
# readings JPM (+0.035..+0.056) sat below it 10/10 and ACET (-0.002..+0.146)
# 9/10, while MSFT (+0.593..+0.612) and IQV (+0.657..+0.666) never came near it.
# It is a bookkeeping boundary for a retired universe, not a tuned parameter —
# the core pool's own sell_threshold is untouched.
legacy_sell_threshold: 0.10

# New entries below this 20-day average dollar volume are skipped (existing
# positions can still be held/sold). Stops micro-caps that slipped in through
# the research vault from ever reaching the order path.
min_adv_usd: 20000000

# Exits. Stops are ATR-based rather than a fixed percentage, so a 60%-volatility
# name gets room to breathe while a quiet one is still cut quickly.
# Effective stop distance = atr_stop_multiple x ATR14, clamped to the bounds.
atr_stop_multiple: 2.5
min_stop_pct: 0.06           # never tighter than this, however quiet the stock
max_stop_pct: 0.20           # never wider than this, however wild the stock

# Winners are cut by a trailing stop instead of a fixed take-profit target, so
# a strong trend can keep running. Set take_profit_pct to a number to re-enable
# a hard target.
take_profit_pct: null
trailing_stop_pct: 0.12      # give back at most ~12% from the high-water mark

# Regime response. In a risk-off tape, position sizes are multiplied by this and
# the entry bar is raised; in risk-on they get the full allowance.
risk_off_size_multiplier: 0.5
risk_off_score_penalty: 0.15  # added to the effective buy threshold when risk-off

# Fast-tier (--fast) LLM-call throttling. Fundamentals and news don't move
# within an hour, so if a symbol was fully analyzed recently AND its quant
# score hasn't moved much since, a fast-tier scan skips the LLM call rather
# than re-deriving the same verdict every 20 minutes. A score move bigger than
# the delta below is treated as a new situation and analyzed anyway, even
# inside the cooldown window. Only affects --fast; the twice-daily full cycle
# always analyzes everything.
escalation_cooldown_minutes: 60
escalation_cooldown_score_delta: 0.15

# Fast-tier entries score on the still-forming daily bar, so indicators move
# continuously during the session and a symbol can cross the buy threshold,
# fall back, and cross again within the hour. A new intraday BUY therefore has
# to clear the bar on this many consecutive scans (~20 min apart) before an
# order goes out. 1 disables the check. Does not apply to the twice-daily deep
# cycle, which scores settled bars, or to exits — a risk exit never waits.
min_intraday_confirm_scans: 3

# Whether the intraday scan may OPEN new positions at all, or only watch the
# risk on existing ones.
#
# Set false because the backtest above says this strategy's edge comes from
# being pickier, not from finding more entries — and intraday entry-hunting
# pushes the other way. Exits, stop reconciliation, and trailing-stop ratchets
# are unaffected: those are the fast tier's real job, and they're the part
# that measurably benefits from seeing live prices instead of yesterday's close.
#
# Set true to let the fast tier take new positions again (still subject to
# min_intraday_confirm_scans, the cooldown, and every risk limit).
allow_intraday_entries: false

# Overnight gap vs the signal's reference price, in ATR units. A BUY whose
# live quote has already run more than this past the signal price is WAIT —
# same idea as `extended`, applied to the close-to-open jump.
max_entry_gap_atr: 0.75

# Entry execution window (US/Eastern). BUY decisions queue as TradeIntents and
# only execute inside this window, so no order is ever placed in the open's
# first half hour — the widest-spread, most chaotic tape of the day (a robust
# intraday microstructure result), and momentum names' historical edge is
# concentrated overnight, not intraday (Lou-Polk-Skouras, JFE 2019).
entry_window_start_et: "10:00"
entry_window_end_et: "15:30"

# Chase guards applied when an intent executes. If the live price is already
# this far above today's open (or above the signal-time price), the intent
# waits for a later scan instead of buying the top of the move — "no entry
# point, no trade". Missing today's open disables only the open-relative gate;
# the signal-relative gate always applies.
max_chase_vs_open_pct: 0.015
max_chase_vs_signal_pct: 0.010

# A BUY whose LLM verdict is missing (analyst CLI/API crashed mid-cycle) is
# downgraded to WAIT: a decision chain missing a layer must not open new risk.
# Exits, stops, and trailing ratchets are unaffected. --skip-llm remains an
# explicit operator override that allows quant-only entries.
require_llm_for_entry: true

# Portfolio risk. Equal-risk sizing only equalises *per-name* stop risk; eight
# 1.5% names can still put ~12% of equity on the line together. This cap is the
# book-level version: sum(position value × stop distance) / equity.
max_portfolio_stop_risk_pct: 0.06

# If a candidate's 60-day return correlation with names already held averages
# above the threshold, size is multiplied by corr_size_multiplier. Cheap stand-in
# for "don't stack another mega-cap on top of three you already own".
corr_lookback: 60
corr_penalty_threshold: 0.75
corr_size_multiplier: 0.5

# Book-level invested / equity cap by regime. Applied to NEW entries every cycle.
# TRIM of names already held runs for labels in trim_regimes, so a tape that
# degrades to neutral automatically sells the book down toward its target —
# exposure follows the environment instead of only ratcheting in.
#
# risk_on 0.85 / neutral 0.65 (was 1.00 / 0.80): full exposure is a privilege of
# a strongly risk-on tape, and even then the cash buffer below binds first.
# Regime-based exposure control is the best-evidenced lever here (Cooper et al.
# JF 2004: momentum profits concentrate in up-markets; partial-Kelly sizing).
regime_max_exposure:
  risk_on: 0.85
  neutral: 0.65
  risk_off: 0.55
  unknown: 0.00

# Cash that is never deployed, whatever the regime table says: the effective
# cap is min(regime cap, 1 - this). "Buy quantity is computed, not 'spend all
# the cash'" — the account always keeps visible dry powder.
min_cash_buffer_pct: 0.05

# The book is actively trimmed toward the regime target only in these labels,
# and only when the sell buffers below are satisfied — existing positions are
# never sold on a single bad reading.
trim_regimes:
  - risk_off

# Sell buffers for TRIM. They gate selling the existing book only; the
# risk-off tightening on NEW entries (size multiplier, higher threshold, 55%
# cap) stays immediate — defense is cheap, dispositions are not.
# - depth: the regime score must be beyond trim_trigger_score, not merely past
#   the risk_off line (-0.20). A shallow dip sells nothing.
# - time: the condition must hold on this many consecutive deep-cycle readings
#   (9:45/16:15 ET, so 2 ≈ one full trading day). A one-cycle VIX spike that
#   reverts by the afternoon sells nothing.
trim_trigger_score: -0.30
trim_confirm_cycles: 2

# Per GICS-style sector (see config/sectors.yaml). A new buy that would breach
# is shrunk; below min_position_pct it is vetoed. Mega-cap overlap across
# Technology / Communication / Consumer Cyclical is still the correlation haircut.
max_sector_pct:
  Technology: 0.35
  Communication Services: 0.30
  Healthcare: 0.30
  Energy: 0.25
  Financial Services: 0.30
  Consumer Cyclical: 0.30
  Consumer Defensive: 0.25
default_max_sector_pct: 0.35
