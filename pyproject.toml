[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trading"
version = "0.1.0"
requires-python = ">=3.11"
# Kept in sync with requirements.txt (which also pins minimums for the venv).
dependencies = [
    "alpaca-py>=0.33.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "tzdata>=2024.1",
    "pyarrow>=15.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Bare `pytest` must not wander into tmp/ (a locked third-party copy there
# breaks collection); the suite lives in tests/.
testpaths = ["tests"]
